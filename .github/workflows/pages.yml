name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a Pages deployment that has started: a cancelled deployment can stay active on
# GitHub's side and make the next deployments fail with "Deployment cancelled". A newer push
# waits in the queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check problem bank
        run: node scripts/check.js && node scripts/check-sim.js && node scripts/check-drills.js && node scripts/check-drills-6370.js && node scripts/check-drills-6300.js
      - name: Stage site files
        run: |
          mkdir _site
          cp -r index.html formula-sheet-6.3700.html formula-sheet-6.3000.html css js .nojekyll _site/
          # Stamp the commit into asset URLs so browsers never mix cached old files with new ones.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
